# Deploys docs/ (static landing page) to GitHub Pages.
# Requires Pages to be enabled with source "GitHub Actions" (private repos need a paid plan).
name: Pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/build-docs.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-docs.mjs
      - uses: actions/configure-pages@v5
        with:
          cname: bot-social.hugoxk.online
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
